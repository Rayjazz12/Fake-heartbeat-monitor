name: Build Fake Heartbeat Monitor

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Geode CLI
        uses: geode-sdk/cli/.github/actions/setup@main

      - name: Setup Geode SDK
        run: |
          $CLI_PROFILE = "$env:GITHUB_WORKSPACE/cli-profile"
          New-Item -ItemType Directory -Path "$CLI_PROFILE/geode/mods" -Force
          geode sdk install "$env:GITHUB_WORKSPACE/geode-sdk-clone"
          geode sdk install-binaries --platform Win64

      - name: Build mod
        run: |
          cd $env:GITHUB_WORKSPACE
          geode build

      - name: Collect build output
        run: |
          cd $env:GITHUB_WORKSPACE
          mkdir -p output
          Copy-Item -Path "build/*.geode" -Destination output/ -ErrorAction SilentlyContinue
          Copy-Item -Path "build/*.pdb" -Destination output/ -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: fake-heartbeat-monitor-geode
          path: output/*.geode

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0 \
            --title "Fake Heartbeat Monitor v1.0.0" \
            --notes "Fake heartbeat monitor HUD with believable BPM steps and death-hold." \
            "artifacts/**/*.geode"

      - name: Upload .geode to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in $(find artifacts -name "*.geode"); do
            gh release upload v1.0.0 "$f" --clobber
          done
